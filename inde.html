<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Memory Match Challenge</title>

    <link rel="stylesheet" href="index.css">

</head>

<body>

    <div class="game-container">

        <h1>🧠 Memory Match</h1>

        <p>Find all the matching pairs!</p>

        <div class="game-info">

            <span>
                Moves:
                <strong id="moves">0</strong>
            </span>

            <span>
                Matches:
                <strong id="matches">0</strong>
            </span>

        </div>


        <div id="gameBoard"></div>


        <button id="restartButton">
            Restart Game
        </button>


        <p id="message"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
